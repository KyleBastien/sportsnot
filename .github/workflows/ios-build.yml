name: iOS Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'packages/widget-bridge/**'
      - 'packages/widget-api/**'
      - 'packages/web/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Select Xcode 26
        run: |
          # macos-26 ships multiple Xcode versions; pick the highest 26.x available.
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on runner"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install iOS platform
        run: |
          xcodebuild -runFirstLaunch
          if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "iPhoneOS SDK already available"
          else
            echo "iPhoneOS SDK missing, downloading iOS platform"
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web bundle
        run: yarn nx build @sportsnot/web
        env:
          VITE_MOCK_MODE: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi

      - name: Sync web bundle into iOS
        run: yarn nx sync-web @sportsnot/ios-app

      - name: Pod install
        run: yarn nx pod-install @sportsnot/ios-app

      - name: Generate Secrets.xcconfig
        env:
          SUPABASE_URL_RAW: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY_RAW: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # xcconfig files treat '//' as a comment token, so raw https://
          # values get truncated to "https:". Break the token with an
          # empty variable reference that resolves away at build time.
          ESCAPED_URL=$(printf '%s' "$SUPABASE_URL_RAW" | sed 's|//|/$()/|g')
          ESCAPED_KEY=$(printf '%s' "$SUPABASE_ANON_KEY_RAW" | sed 's|//|/$()/|g')
          cat > ios/App/Secrets.xcconfig <<EOF
          SUPABASE_URL = ${ESCAPED_URL}
          SUPABASE_ANON_KEY = ${ESCAPED_KEY}
          EOF
          echo "xcconfig written. url_length=${#SUPABASE_URL_RAW} key_length=${#SUPABASE_ANON_KEY_RAW}"

      - name: Build App target
        run: yarn nx build @sportsnot/ios-app

      - name: Build SportsNotWidget extension
        run: yarn nx build-widget @sportsnot/ios-app
