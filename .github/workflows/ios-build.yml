name: iOS Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'packages/widget-bridge/**'
      - 'packages/widget-api/**'
      - 'packages/web/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web bundle
        run: yarn nx build @sportsnot/web
        env:
          VITE_MOCK_MODE: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi

      - name: Sync web bundle into iOS
        run: yarn nx sync-web @sportsnot/ios-app

      - name: Pod install
        run: yarn nx pod-install @sportsnot/ios-app

      - name: Build App target
        run: yarn nx build @sportsnot/ios-app

      - name: Build SportsNotWidget extension
        run: yarn nx build-widget @sportsnot/ios-app
