name: MoneyPuck summary fetch

on:
  push:
    branches:
      - claude/sportsnot-ml-draft-prd-mk9348
    paths:
      - .github/workflows/moneypuck-fetch.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch direct season summaries
        shell: bash
        run: |
          set -euo pipefail
          root="moneypuck-season-summary"
          mkdir -p "$root"

          fetch_csv() {
            local url="$1"
            local output="$2"
            local temporary="${output%.gz}.download"
            local attempt delay metadata final_url content_type

            mkdir -p "$(dirname "$output")"
            for attempt in 1 2 3 4; do
              metadata="$(
                curl --fail --silent --show-error --location \
                  --output "$temporary" \
                  --write-out '%{url_effective}|%{content_type}' \
                  "$url"
              )" || metadata=""
              final_url="${metadata%%|*}"
              content_type="${metadata#*|}"
              if [[ "$final_url" == "$url" ]] &&
                [[ "$content_type" == text/csv* ]] &&
                [[ -s "$temporary" ]] &&
                ! head -c 32 "$temporary" | grep -qi '<html'; then
                gzip --no-name --best --stdout "$temporary" > "$output"
                rm "$temporary"
                sleep 1
                return 0
              fi

              rm -f "$temporary"
              if [[ "$attempt" -lt 4 ]]; then
                delay=$((2 ** (attempt - 1)))
                sleep "$delay"
              fi
            done

            echo "failed after four attempts: $url" >&2
            return 1
          }

          for year in $(seq 2008 2025); do
            for game_type in regular playoffs; do
              for table in skaters goalies teams lines; do
                url="https://moneypuck.com/moneypuck/playerData/seasonSummary/${year}/${game_type}/${table}.csv"
                output="${root}/${year}/${game_type}/${table}.csv.gz"
                fetch_csv "$url" "$output"
              done
            done
          done

          test "$(find "$root" -type f -name '*.csv.gz' | wc -l)" -eq 144

      - name: Upload summaries
        uses: actions/upload-artifact@v4
        with:
          name: moneypuck-season-summary
          path: moneypuck-season-summary/
          if-no-files-found: error
          retention-days: 1
