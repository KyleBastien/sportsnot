<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SportsNot Demo</title>
    <script>
      // SPA redirect for GitHub Pages — demo subfolder variant
      // Keeps the /demo/ path segment when redirecting
      var pathSegmentsToKeep = 1; // 1 to preserve /demo/ prefix
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
