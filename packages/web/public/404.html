<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SportsNot</title>
    <script>
      // SPA redirect for GitHub Pages
      // Converts the path into a query string so index.html can handle routing
      var pathSegmentsToKeep = 1; // 1 for project site (e.g. /sportsnot/), 0 for user site
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
