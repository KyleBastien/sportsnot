# Manual injury overrides — the FINAL AUTHORITY over the ESPN source (US-008).
#
# Each entry under `overrides` merges on top of the automatically-ingested ESPN
# injuries feed. Matching precedence per entry:
#   1. `espn_id` (exact ESPN athlete id) if provided
#   2. else `player` name (accent/punctuation-insensitive)
#
# A matched entry REWRITES the source row's status / return_date / detail.
# An unmatched entry is INJECTED as a new row (assert an injury the feed missed).
# `remove: true` deletes the matched row (assert a player is actually healthy).
#
# Fields:
#   player:      display name (recommended for readability; used for matching)
#   espn_id:     ESPN athlete id (optional; exact match)
#   status:      out | ir | day_to_day | healthy  (normalized on load)
#   return_date: expected return, e.g. "2026-05-01"
#   detail:      free-text note, e.g. "Lower Body"
#   team:        team name (only used when injecting a brand-new row)
#   remove:      true to delete a matched row
#   return_game: round game (1-based) the player is expected back; pins availability
#                and OVERRIDES the return-time model curve (US-015)
#
# Example (commented out — ships empty; the ESPN feed is the routine source):
# overrides:
#   - player: "Connor McDavid"
#     espn_id: 3895074
#     status: day_to_day
#     return_date: "2026-05-01"
#     detail: "owner: precautionary rest"

overrides: []
